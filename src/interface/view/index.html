    <title>curlone — конвертер команды curl в код на языке 1С</title>

    <link rel="apple-touch-icon" sizes="60x60" href="images/favicons/apple-icon-60x60.png">

    <link rel="apple-touch-icon" sizes="120x120" href="images/favicons/apple-icon-120x120.png">

    <link rel="apple-touch-icon" sizes="152x152" href="images/favicons/apple-icon-152x152.png">

    <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/favicon-16x16.png">

    <link rel="stylesheet" href="static/index.css">
    <script type="module" src="static/index.js"></script>
</head>

<body>
    <div class="github-corner">
        <a href="https://github.com/alei1180/curlone" class="github-corner-link" aria-label="Исходный код на GitHub"
            target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 250 250" aria-hidden="true">
                <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
                <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
                <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
            </svg>
        </a>
        <a href="{{ Модель.СсылкаНаВерсию }}" class="github-version"
            aria-label="Релиз curlone версии {{ Модель.ВерсияПриложения }}"
            target="_blank" rel="noopener noreferrer">ver {{ Модель.ВерсияПриложения }}</a>
    </div>
    <header class="container logo">
        <img src="images/curlone-logo.png" alt="curlone" width="200" height="200">
    </header>

    <main class="container workspace">
        <h1 class="visually-hidden">Конвертер команды curl в код на языке 1С</h1>

        <section class="panel" aria-labelledby="command-title">
            <form id="curl-form" name="curl" novalidate>
                <label id="command-title" for="command">Команда curl<sup><sup><sup>(bash)</sup></sup></sup></label>
                <textarea name="command" id="command" spellcheck="false" wrap="soft"
                    placeholder="curl example.com" aria-errormessage="errors" required disabled></textarea>

                <div class="conversion-controls">
                    <button type="submit" id="convert" class="primary-button" disabled>Конвертировать</button>

                    <fieldset class="generator-options">
                        <legend class="visually-hidden">Генератор кода</legend>
                        <label class="choice">
                            <input type="radio" id="onec" name="lang" value="1c" checked disabled>
                            <span>1С</span>
                        </label>
                        <label class="choice">
                            <input type="radio" id="connector" name="lang" value="connector" disabled>
                            <span>Connector</span>
                        </label>
                    </fieldset>
                </div>
            </form>

        </section>

        <section class="panel" aria-labelledby="output-title">
            <div class="output-messages">
                <div id="errors" class="message message-error" role="alert" hidden></div>
                <div id="warnings" class="message message-warning" role="status" aria-live="polite" hidden></div>
            </div>

            <div class="output-header">
                <h2 id="output-title">Код 1С</h2>

                <div class="output-options">
                    <label class="choice json-option">
                        <input type="checkbox" id="json-option" aria-describedby="json-option-help" disabled>
                        <span>JSON</span>
                    </label>
                    <div class="tooltip">
                        <details>
                            <summary>
                                <span aria-hidden="true">(?)</span>
                                <span class="visually-hidden">О параметре JSON</span>
                            </summary>
                        </details>
                        <span class="tooltip-text">
                            Десериализовать ответ HTTP-запроса из JSON
                        </span>
                    </div>
                    <span id="json-option-help" class="visually-hidden">
                        Десериализовать ответ HTTP-запроса из JSON.
                    </span>
                </div>

                <div class="locale-switches" role="group" aria-label="Язык кода">
                    <button id="locale-ru" name="locale" type="button" value="ru"
                        aria-pressed="true" disabled>ru</button>
                    <button id="locale-en" name="locale" type="button" value="en"
                        aria-pressed="false" disabled>en</button>
                </div>
            </div>

            <div tabindex="0" id="output" class="output" aria-labelledby="output-title" aria-busy="true"></div>
            <button type="button" id="copy" class="primary-button" disabled>Скопировать</button>
        </section>
    </main>

    <footer class="container footer">
        <p>
            <a href="https://github.com/alei1180/curlone" target="_blank" rel="noopener noreferrer">curlone</a>
            powered by
            <a href="https://github.com/EvilBeaver/OneScript" target="_blank" rel="noopener noreferrer">OneScript</a>
            and
            <a href="https://github.com/autumn-library/winow" target="_blank" rel="noopener noreferrer">Winow</a>
        </p>
    </footer>
</body>

</html>
